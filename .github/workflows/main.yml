name: Data Preprocessing Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Preprocessing Script
        run: |
          # Pastikan jalur folder dan nama file sudah benar
          python Preprocessing/automate_Zeny-Arsya-Fortilla.py

      - name: Commit and Push Preprocessed Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan file hasil preprocessing kamu
          git add -f preprocessing/*.csv
          
          # Commit dan push kembali ke repo
          git commit -m "Update preprocessed data [skip ci]" || echo "No changes to commit"
          git push origin main
